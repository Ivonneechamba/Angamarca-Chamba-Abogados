<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Blog Jurídico | Angamarca Chamba Abogados</title>

<meta name="description"
    content="Artículos jurídicos sobre derecho administrativo, civil, penal y familiar en Ecuador.">

<link rel="stylesheet" href="../styles.css">

</head>

<body>

<header class="header">
    <div class="container">
    <img src="../logo.jpg" class="logo" alt="Angamarca Chamba Abogados">

    <nav>
        <ul>
            <li><a href="../index.html">Inicio</a></li>
        </ul>
    </nav>

</div>

</header>

<section class="section white">

<div class="container">

    <h1>Blog Jurídico</h1>

    <p>
        Análisis jurídicos, comentarios de jurisprudencia y artículos de interés
        sobre derecho administrativo, civil, penal y familiar.
    </p>

    <hr><br>

    <div id="lista-articulos"></div>

</div>

</section>

<footer class="footer">
    <p>© 2026 Angamarca Chamba Abogados</p>
</footer>

<script>

fetch("articulos.json")
.then(response => response.json())
.then(data => {

    let html = "";

   data.forEach(post => {

html += `

<article class="entrada-blog">


<img src="${post.imagen}" class="imagen-blog">


<h2>
${post.titulo}
</h2>


<p class="autor">
<strong>Autora:</strong> ${post.autora}
</p>


<p class="fecha">
${post.fecha} | ${post.categoria}
</p>


<p>
${post.contenido}
</p>


</article>


<hr>


`;

});


    document.getElementById("lista-articulos").innerHTML = html;


})
.catch(error => {

    console.log("Error:", error);

    document.getElementById("lista-articulos").innerHTML =
    "<p>No se pudieron cargar los artículos.</p>";

});

</script>

</body>
</html>
